{% extends 'noticias/base.html' %}
{% block title %}Formulario Categoría | Vox Campus{% endblock %}

{% block content %}
<h2>{% if form.instance.pk %}Editar{% else %}Crear{% endif %} Categoría</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="{% url 'categoria_lista' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
