{% extends 'noticias/base.html' %}
{% block title %}Eliminar Noticia | Vox Campus{% endblock %}

{% block content %}
<h2>Eliminar Noticia</h2>
<p>¿Estás seguro que deseas eliminar la noticia "{{ noticia.titulo }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'noticia_lista' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
