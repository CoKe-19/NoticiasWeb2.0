{% extends 'noticias/base.html' %}
{% load static %}
{% block content %}
<h3 class="fw-bold text-danger mb-3"><i class="bi bi-clock-history me-2"></i>Actividad Reciente</h3>
<ul class="list-group list-group-flush">
   {% for a in actividades %}
   <li class="list-group-item d-flex justify-content-between align-items-center bg-dark text-white">
      <span>
         <i class="bi bi-person-fill text-danger me-2"></i>
         <a href="{{ a.url }}" class="text-decoration-none text-white fw-semibold">@{{ a.usuario.username }}</a>
         {{ a.accion }}
      </span>
      <small class="text-muted">{{ a.fecha|timesince }} atrás</small>
   </li>
   {% empty %}
   <li class="list-group-item bg-dark text-center text-muted">Sin actividad reciente</li>
   {% endfor %}
</ul>
{% endblock %}
