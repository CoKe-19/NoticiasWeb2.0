{% extends 'noticias/base.html' %}
{% block title %}Formulario Noticia | Vox Campus{% endblock %}

{% block content %}
<h2>{% if form.instance.pk %}Editar{% else %}Crear{% endif %} Noticia</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="{% url 'noticia_lista' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
