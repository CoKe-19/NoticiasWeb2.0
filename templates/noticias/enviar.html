{% extends 'noticias/base.html' %}
{% load static %}
{% block title %}Enviar mensaje{% endblock %}

{% block content %}
<div class="container my-5" style="max-width: 600px;">
  <div class="card shadow-lg border-0 rounded-4 bg-dark text-light">
    <div class="card-header bg-danger bg-gradient text-white rounded-top-4">
      <h4 class="mb-0"><i class="bi bi-send-check-fill me-2"></i>Enviar mensaje</h4>
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        
        <div class="mb-3">
          {{ form.receptor.label_tag }}
          {{ form.receptor }}
        </div>

        <div class="mb-3">
          {{ form.contenido.label_tag }}
          {{ form.contenido }}
        </div>

        <div class="text-end">
          <button type="submit" class="btn btn-success px-4 fw-bold">
            <i class="bi bi-send-fill me-1"></i>Enviar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
