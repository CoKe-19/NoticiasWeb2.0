{% extends 'noticias/base.html' %}
{% block title %}{{ titulo }} | Vox Campus{% endblock %}
{% block content %}
<div class="container py-5">
   <div class="form-card">
      <h2 class="form-title">{{ titulo }}</h2>
      <form method="POST" enctype="multipart/form-data" class="styled-form">
         {% csrf_token %}
         {{ form.as_p }}
         <div class="form-buttons">
            <button type="submit" class="btn-primary">{{ boton_texto }}</button>
            <a href="{{ cancelar_url }}" class="btn-secondary">Cancelar</a>
         </div>
      </form>
   </div>
</div>
{% endblock %}
